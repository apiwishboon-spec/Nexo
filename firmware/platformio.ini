; PlatformIO project configuration for Nexo Cardputer firmware.
;
; Target: M5Stack Cardputer-Adv (K152 Mesh Kit) / Stamp-S3A (ESP32-S3FN8, 8MB).
; The generated app binary (.pio/build/<env>/firmware.bin) is a Launcher-compatible
; app image: install it from the Launcher SD/WebUI menu.
[platformio]
default_envs = m5stack-cardputer

[env:m5stack-cardputer]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
upload_speed = 1500000
monitor_speed = 115200
board_build.flash_size = 8MB
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
board_upload.offset_address = 0x10000
build_unflags = -std=gnu++11
build_flags =
    -DESP32S3
    -std=gnu++17
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=3
    -DNEXO_FW_VERSION='"1.0.0"'
    -DNEXO_PROTOCOL_VERSION=1
lib_deps =
    M5Cardputer=https://github.com/m5stack/M5Cardputer
    h2zero/NimBLE-Arduino@^1.4.3
    bblanchon/ArduinoJson@^7.0.4
    esphome/ESP32-audioI2S@^2.3.0

; Host unit tests for the portable core (no hardware required).
[env:native]
platform = native
build_flags =
    -DNEXO_NATIVE=1
    -std=gnu++17
lib_deps =
    bblanchon/ArduinoJson@^7.0.4
test_framework = unity
